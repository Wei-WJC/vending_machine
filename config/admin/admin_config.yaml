# 管理员配置文件
admins:
  - name: "admin"
    password: "admin123"
    role: "超级管理员"
    permissions:
      - "view_inventory"
      - "view_sales"
      - "view_profit"
      - "check_product"
      - "manage_users"
      - "system_config"
  
  - name: "manager"
    password: "manager456"
    role: "店长"
